<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHermes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" rx="16" fill="url(#bgHermes)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="260" y1="60" x2="260" y2="480"/>
    <line x1="530" y1="60" x2="530" y2="480"/>
  </g>

  <!-- Top Application Bar -->
  <rect width="800" height="50" rx="16" fill="#091024"/>
  <rect y="38" width="800" height="12" fill="#091024"/>
  <!-- Window Controls -->
  <circle cx="28" cy="25" r="5" fill="#ef4444"/>
  <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="25" r="5" fill="#10b981"/>
  <!-- Title -->
  <text x="85" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">HERMES TELECOM NOC CORE</text>
  <rect x="290" y="16" width="145" height="18" rx="9" fill="#2563eb" fill-opacity="0.3"/>
  <text x="302" y="29" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="600">SIP GATEWAY: ONLINE</text>

  <!-- Status indicator -->
  <circle cx="710" cy="25" r="4" fill="#10b981"/>
  <text x="722" y="29" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">SLA: 99.999%</text>

  <!-- Metric Widget 1: Concurrent Voice Channels -->
  <g transform="translate(30, 75)">
    <rect width="225" height="95" rx="10" fill="#121b36" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Concurrent Calls</text>
    <text x="16" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">4,820</text>
    <text x="105" y="58" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="700">active channels</text>
    <rect x="16" y="74" width="190" height="6" rx="3" fill="#1e293b"/>
    <rect x="16" y="74" width="175" height="6" rx="3" fill="#2563eb"/>
    <text x="16" y="90" fill="#64748b" font-family="monospace" font-size="9">FreeSWITCH Cluster Load: 88%</text>
  </g>

  <!-- Metric Widget 2: Latency & QoS -->
  <g transform="translate(285, 75)">
    <rect width="230" height="95" rx="10" fill="#121b36" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">RTP Audio Latency</text>
    <text x="16" y="60" fill="#10b981" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">18.4 ms</text>
    <text x="135" y="58" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">jitter: 2ms</text>
    <text x="16" y="80" fill="#64748b" font-family="monospace" font-size="10">High-Definition Opus &amp; G.711</text>
    <circle cx="195" cy="50" r="18" fill="none" stroke="#1e293b" stroke-width="4"/>
    <circle cx="195" cy="50" r="18" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="110 5" stroke-linecap="round"/>
  </g>

  <!-- Metric Widget 3: SMS Gateway Throughput -->
  <g transform="translate(545, 75)">
    <rect width="225" height="95" rx="10" fill="#121b36" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">SMS / OTP Dispatch</text>
    <text x="16" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">125,000</text>
    <text x="125" y="58" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="700">msgs / min</text>
    <text x="16" y="80" fill="#64748b" font-family="monospace" font-size="10">Direct SMPP Tier-1 Carriers</text>
  </g>

  <!-- Main Chart Section: Realtime SIP Traffic & Routing -->
  <g transform="translate(30, 190)">
    <rect width="485" height="260" rx="12" fill="#101830" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Real-Time SIP Traffic &amp; AI Voice Streams</text>
    <text x="20" y="50" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Global carrier terminations and conversational AI agent sessions</text>

    <!-- Chart Fill Area -->
    <path d="M 20 230 L 20 170 Q 80 140 130 110 T 230 140 T 330 90 T 430 105 L 465 80 L 465 230 Z" fill="url(#cyanLine)"/>
    <!-- Chart Primary Line -->
    <path d="M 20 170 Q 80 140 130 110 T 230 140 T 330 90 T 430 105 L 465 80" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Audio Waveform / AI Stream overlay -->
    <g transform="translate(20, 160)" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round">
      <line x1="10" y1="0" x2="10" y2="20"/>
      <line x1="20" y1="-10" x2="20" y2="30"/>
      <line x1="30" y1="-25" x2="30" y2="45"/>
      <line x1="40" y1="-15" x2="40" y2="35"/>
      <line x1="50" y1="0" x2="50" y2="20"/>
      <line x1="60" y1="-30" x2="60" y2="50"/>
      <line x1="70" y1="-20" x2="70" y2="40"/>
      <line x1="80" y1="-5" x2="80" y2="25"/>
    </g>

    <!-- Legend -->
    <circle cx="330" cy="28" r="4" fill="#06b6d4"/>
    <text x="340" y="32" fill="#94a3b8" font-family="monospace" font-size="10">SIP Traffic</text>
    <circle cx="420" cy="28" r="4" fill="#2563eb"/>
    <text x="430" y="32" fill="#94a3b8" font-family="monospace" font-size="10">AI Voice WebRTC</text>

    <!-- X Axis Ticks -->
    <text x="20" y="248" fill="#475569" font-family="monospace" font-size="9">10:00</text>
    <text x="120" y="248" fill="#475569" font-family="monospace" font-size="9">10:15</text>
    <text x="220" y="248" fill="#475569" font-family="monospace" font-size="9">10:30</text>
    <text x="320" y="248" fill="#475569" font-family="monospace" font-size="9">10:45</text>
    <text x="420" y="248" fill="#475569" font-family="monospace" font-size="9">11:00</text>
  </g>

  <!-- Right Panel: Carrier Trunk Status & AI Agent Routing -->
  <g transform="translate(535, 190)">
    <rect width="235" height="260" rx="12" fill="#101830" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Carrier Interconnects</text>

    <!-- Carrier 1 -->
    <g transform="translate(18, 52)">
      <rect width="200" height="42" rx="6" fill="#13203f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="15" cy="21" r="4" fill="#10b981"/>
      <text x="28" y="19" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Tier-1 Telco Primary</text>
      <text x="28" y="33" fill="#64748b" font-family="monospace" font-size="9">SIP Trunk • 2,400 Channels</text>
      <text x="160" y="25" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">ACTIVE</text>
    </g>

    <!-- Carrier 2 -->
    <g transform="translate(18, 102)">
      <rect width="200" height="42" rx="6" fill="#13203f" stroke="#1e293b" stroke-width="1"/>
      <circle cx="15" cy="21" r="4" fill="#10b981"/>
      <text x="28" y="19" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">International Gateway</text>
      <text x="28" y="33" fill="#64748b" font-family="monospace" font-size="9">SIP Trunk • 1,800 Channels</text>
      <text x="160" y="25" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">ACTIVE</text>
    </g>

    <!-- AI Voice Agent Hub -->
    <g transform="translate(18, 152)">
      <rect width="200" height="42" rx="6" fill="#13203f" stroke="#2563eb" stroke-width="1"/>
      <circle cx="15" cy="21" r="4" fill="#38bdf8"/>
      <text x="28" y="19" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">AI Voice Orchestrator</text>
      <text x="28" y="33" fill="#38bdf8" font-family="monospace" font-size="9">WebSockets • 620 Sessions</text>
      <text x="160" y="25" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">98.4%</text>
    </g>

    <!-- Bottom summary -->
    <text x="18" y="222" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">AUTOMATED FAILOVER</text>
    <text x="18" y="240" fill="#10b981" font-family="monospace" font-size="10">Zero dropped calls in last 365d</text>
  </g>
</svg>
