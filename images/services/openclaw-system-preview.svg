<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="200" y1="60" x2="200" y2="480"/>
    <line x1="400" y1="60" x2="400" y2="480"/>
    <line x1="600" y1="60" x2="600" y2="480"/>
  </g>

  <!-- Top Application Bar -->
  <rect width="800" height="50" rx="16" fill="#0b1120"/>
  <rect y="38" width="800" height="12" fill="#0b1120"/>
  <!-- Window Controls -->
  <circle cx="28" cy="25" r="5" fill="#ef4444"/>
  <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="25" r="5" fill="#10b981"/>
  <!-- Title -->
  <text x="85" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">OPENCLAW ENGINE</text>
  <rect x="220" y="16" width="135" height="18" rx="9" fill="#0369a1" fill-opacity="0.3"/>
  <text x="232" y="29" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">CLUSTER: PROD-SEA-01</text>

  <!-- Status indicator -->
  <circle cx="715" cy="25" r="4" fill="#10b981"/>
  <text x="726" y="29" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">LIVE: 128 NODES</text>

  <!-- Metric Widget 1: Ingestion Velocity -->
  <g transform="translate(30, 75)">
    <rect width="225" height="95" rx="10" fill="#131d33" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Crawler Velocity</text>
    <text x="16" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">14,850</text>
    <text x="110" y="58" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">pages / sec</text>
    <path d="M 16 80 L 50 78 L 90 70 L 130 74 L 170 65 L 205 62" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Metric Widget 2: Anti-Bot & Proxy -->
  <g transform="translate(285, 75)">
    <rect width="230" height="95" rx="10" fill="#131d33" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Bypass Success Rate</text>
    <text x="16" y="60" fill="#10b981" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">99.84%</text>
    <text x="16" y="80" fill="#64748b" font-family="monospace" font-size="10">Auto-Rotating 25,000 IPs</text>
    <circle cx="195" cy="50" r="18" fill="none" stroke="#1e293b" stroke-width="4"/>
    <circle cx="195" cy="50" r="18" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="100 15" stroke-linecap="round"/>
  </g>

  <!-- Metric Widget 3: Realtime Latency -->
  <g transform="translate(545, 75)">
    <rect width="225" height="95" rx="10" fill="#131d33" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Extraction Pipeline</text>
    <text x="16" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">118 ms</text>
    <text x="110" y="58" fill="#a855f7" font-family="monospace" font-size="12" font-weight="700">p99 latency</text>
    <text x="16" y="80" fill="#64748b" font-family="monospace" font-size="10">Kafka &gt; ClickHouse Ingest</text>
  </g>

  <!-- Main Chart Section: Distributed Ingestion Pipeline -->
  <g transform="translate(30, 190)">
    <rect width="485" height="260" rx="12" fill="#11192c" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Distributed Ingestion Telemetry</text>
    <text x="20" y="50" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Active worker throughput across 128 Kubernetes worker pods</text>

    <!-- Chart Area Fill -->
    <path d="M 20 230 L 20 180 Q 70 120 120 145 T 220 100 T 320 130 T 420 80 L 465 95 L 465 230 Z" fill="url(#glowLine)"/>
    <!-- Chart Primary Line -->
    <path d="M 20 180 Q 70 120 120 145 T 220 100 T 320 130 T 420 80 L 465 95" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Chart Secondary Line -->
    <path d="M 20 205 Q 80 180 140 190 T 260 155 T 370 170 T 465 140" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Legend -->
    <circle cx="340" cy="28" r="4" fill="#38bdf8"/>
    <text x="350" y="32" fill="#94a3b8" font-family="monospace" font-size="10">Clean Extracted</text>
    <circle cx="430" cy="28" r="4" fill="#a855f7"/>
    <text x="440" y="32" fill="#94a3b8" font-family="monospace" font-size="10">Raw Streams</text>

    <!-- X Axis Ticks -->
    <text x="20" y="248" fill="#475569" font-family="monospace" font-size="9">14:00</text>
    <text x="120" y="248" fill="#475569" font-family="monospace" font-size="9">14:15</text>
    <text x="220" y="248" fill="#475569" font-family="monospace" font-size="9">14:30</text>
    <text x="320" y="248" fill="#475569" font-family="monospace" font-size="9">14:45</text>
    <text x="420" y="248" fill="#475569" font-family="monospace" font-size="9">15:00</text>
  </g>

  <!-- Right Panel: Worker Node Grid & Active Tasks -->
  <g transform="translate(535, 190)">
    <rect width="235" height="260" rx="12" fill="#11192c" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Cluster Nodes Status</text>

    <!-- 12 Nodes Grid Representation -->
    <g transform="translate(18, 50)">
      <rect x="0" y="0" width="44" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">w-01</text>

      <rect x="52" y="0" width="44" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="60" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">w-02</text>

      <rect x="104" y="0" width="44" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="112" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">w-03</text>

      <rect x="156" y="0" width="44" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="164" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">w-04</text>

      <rect x="0" y="32" width="44" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="48" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">w-05</text>

      <rect x="52" y="32" width="44" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="60" y="48" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">w-06</text>

      <rect x="104" y="32" width="44" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="112" y="48" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">w-07</text>

      <rect x="156" y="32" width="44" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="164" y="48" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">w-08</text>
    </g>

    <!-- Active Tasks Telemetry -->
    <rect x="18" y="125" width="200" height="1" fill="#1e293b"/>
    <text x="18" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">LIVE QUEUE PIPELINE</text>
    
    <text x="18" y="175" fill="#e2e8f0" font-family="monospace" font-size="11">Job: E-Commerce Sync</text>
    <rect x="18" y="184" width="200" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="184" width="168" height="6" rx="3" fill="#0284c7"/>
    <text x="18" y="202" fill="#64748b" font-family="monospace" font-size="9">84% completed (4.2M / 5.0M)</text>

    <text x="18" y="224" fill="#e2e8f0" font-family="monospace" font-size="11">Job: Price Intelligence ETL</text>
    <rect x="18" y="233" width="200" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="233" width="190" height="6" rx="3" fill="#10b981"/>
    <text x="18" y="250" fill="#64748b" font-family="monospace" font-size="9">95% completed (1.9M / 2.0M)</text>
  </g>
</svg>
